            const [activeActionModal, setActiveActionModal] = useState(null);
            const [votingModal, setVotingModal] = useState(false);
            const [showOwnerPanel, setShowOwnerPanel] = useState(false);
            const [showEndModal, setShowEndModal] = useState(false);
            const [sysAlert, setSysAlert] = useState(null); 
            const [punishModal, setPunishModal] = useState(null); 
            const [showStaffPanel, setShowStaffPanel] = useState(false);
            const [showReportModal, setShowReportModal] = useState(false);
            const [showRules, setShowRules] = useState(false);

            const [targetUserId, setTargetUserId] = useState("");
            const [targetRole, setTargetRole] = useState("admin");
            const [punishReason, setPunishReason] = useState("");
            const [muteDuration, setMuteDuration] = useState(15);
            const [appealText, setAppealText] = useState("");
            const [reportText, setReportText] = useState("");

            const [staffList, setStaffList] = useState([]);
            const [systemLogs, setSystemLogs] = useState([]);
            const [bugReports, setBugReports] = useState([]);
            const [appealsList, setAppealsList] = useState([]);

            const gameStateRef = useRef(null);
            useEffect(() => { gameStateRef.current = gameState; }, [gameState]);

            // === ГЛОБАЛЬНЫЕ ВЫЧИСЛЕНИЯ ===
            const staffRoles = ['owner', 'admin', 'host', 'curator', 'tester'];
            const isStaff = staffRoles.includes(role);
            
            const currentPlayersArr = gameState?.players ? (Array.isArray(gameState.players) ? gameState.players : Object.values(gameState.players)) : [];
            const myIdx = currentPlayersArr.findIndex(p => p.uid === user?.uid);
            const isMeSpk = myIdx !== -1 && gameState?.speakerId === currentPlayersArr[myIdx]?.id;
            
            const isReallyAdmin = isAdmin && isStaff && myIdx === -1; 
            const isGod = isReallyAdmin && (role === 'owner' || role === 'tester'); 
            const canEdit = isReallyAdmin && (role === 'owner' || role === 'admin' || role === 'tester'); 
            const canPlay = isReallyAdmin && (role === 'owner' || role === 'admin' || role === 'host' || role === 'tester'); 
            const canExile = isReallyAdmin && (role === 'owner' || role === 'admin' || role === 'host' || role === 'tester');
            const canWarn = isReallyAdmin && (role === 'owner' || role === 'admin' || role === 'curator' || role === 'tester');

            // ИИ-хост (Управление ботами. Берет первый активный игрок, чтобы боты не дохли при выходе создателя)
            const activeUids = currentPlayersArr.filter(p => p.uid).map(p => p.uid).sort();
            const amIRunner = activeUids.length > 0 ? activeUids[0] === user?.uid : gameState?.hostUid === user?.uid;
            const isAiRunner = roomId && amIRunner;

            // === СЛУШАТЕЛИ FIREBASE ===
            useEffect(() => {
                auth.onAuthStateChanged(u => { 
                    if(u) {
                        setUser(u); 
                        db.ref(`users/${u.uid}`).on('value', snap => {
                            const val = snap.val();
                            if (val) {
                                if (val.isBanned || (val.banUntil && val.banUntil > Date.now())) { 
                                    setIsBanned(true); setIsAdmin(false); 
                                } else {
                                    if (val.banUntil && val.banUntil <= Date.now()) {
                                        db.ref(`users/${u.uid}/isBanned`).set(false);
                                        db.ref(`users/${u.uid}/banUntil`).set(null);
                                    }
                                    setIsBanned(false);
                                    setRole(val.role || 'player');
                                    setUserName(val.name || val.Name || "Объект");
                                    setUserAvatar(val.avatar || val.Avatar || ""); 
                                    if (!val.userId) {
                                        db.ref('system/lastId').transaction(id => (id || 0) + 1, (err, comm, snapId) => {
                                            const newId = snapId.val();
                                            db.ref(`users/${u.uid}/userId`).set(newId);
                                            setUserId(newId);
                                        });
                                    } else { setUserId(val.userId); }
                                    setUserStats(val.stats || { games: 0, survived: 0 });
                                    setUserMute(val.mute || null);
                                }
                            } else {
                                db.ref(`users/${u.uid}`).set({ name: "Новый Игрок", role: "player", isBanned: false });
                            }
                        });
                    } else { setUser(null); }
                });

                db.ref('rooms').on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        const rList = Object.entries(data).map(([id, r]) => ({id, ...r}));
                        rList.sort((a, b) => (b.isAdminHost ? 1 : 0) - (a.isAdminHost ? 1 : 0));
                        setRoomsList(rList);
                    } else { setRoomsList([]); }
                });

                db.ref('logs').limitToLast(50).on('value', snap => setSystemLogs(snap.val() ? Object.values(snap.val()).reverse() : []));
                db.ref('reports').on('value', snap => setBugReports(snap.val() ? Object.entries(snap.val()).reverse() : []));
                db.ref('appeals').on('value', snap => setAppealsList(snap.val() ? Object.entries(snap.val()).reverse() : []));
            }, []);

            useEffect(() => {
                if (roomId) {
                    const roomRef = db.ref(`rooms/${roomId}`);
                    const cb = roomRef.on('value', snap => {
                        const val = snap.val();
                        if (!val && currentView === 'game') {
                            setGameState(null);
                            setRoomId(null);
                            setCurrentView('lobby');
                            setSysAlert({t: 'КОМНАТА ЗАКРЫТА', d: 'Лобби было удалено или игра завершена.'});
                        } else {
                            setGameState(val);
                        }
                    });
                    
                    const chatRef = db.ref(`rooms/${roomId}/chat`).limitToLast(50);
                    const chatCb = chatRef.on('value', snap => {
                        setMessages(snap.val() ? Object.entries(snap.val()).map(([id, msg]) => ({id, ...msg})) : []);
                    });
                    
                    return () => { roomRef.off('value', cb); chatRef.off('value', chatCb); };
                }
            }, [roomId, currentView]);

            useEffect(() => {
                if (role === 'owner' || role === 'curator') {
                    db.ref('users').on('value', snap => {
                        if(snap.val()) setStaffList(Object.entries(snap.val()).map(([uid, u]) => ({uid, ...u})).filter(u => ['admin', 'host', 'curator', 'tester'].includes(u.role) && u.uid !== user?.uid));
                    });
                }
            }, [role, user?.uid]);

            const handleVolChange = (e) => {
                const v = e.target.value;
                setGlobalVol(v);
                localStorage.setItem('bunker_vol', v);
            };

            const logAction = (action, target, reason) => db.ref('logs').push({ time: Date.now(), admin: userName, action, target, reason });
            const botSay = (text) => { db.ref(`rooms/${roomId}/chat`).push({ uid: 'ai_bot', name: 'ВЕДУЩАЯ 💅', role: 'host', text, time: Date.now() }); playSfx(sfx.event); };

            // === ФУНКЦИИ ПРОПУСКА ===
            const handleSkipDiscussionVote = () => {
                if (!gameStateRef.current) return;
                const skips = gameStateRef.current.skipDiscVotes ? Object.values(gameStateRef.current.skipDiscVotes) : [];
                if (!skips.includes(user.uid)) {
                    db.ref(`rooms/${roomId}/skipDiscVotes`).push(user.uid);
                    setSysAlert({t:'ГОЛОС ПРИНЯТ', d:'Вы проголосовали за пропуск обсуждения.'});
                }
            };

            const handleSkipEventVote = () => {
                if (!gameStateRef.current) return;
                const skips = gameStateRef.current.skipEventVotes ? Object.values(gameStateRef.current.skipEventVotes) : [];
                if (!skips.includes(user.uid)) {
                    db.ref(`rooms/${roomId}/skipEventVotes`).push(user.uid);
                    setSysAlert({t:'ГОЛОС ПРИНЯТ', d:'Вы проголосовали за скип ивента.'});
                }
            };

            const handleEndGame = () => {
                if (gameState && gameState.players) {
                    const safePlayers = Array.isArray(gameState.players) ? gameState.players : Object.values(gameState.players);
                    safePlayers.forEach(p => {
                        if (p.uid) {
                            db.ref(`users/${p.uid}/stats`).once('value').then(snap => {
                                const s = snap.val() || { games: 0, survived: 0 };
                                db.ref(`users/${p.uid}/stats`).set({ games: s.games + 1, survived: p.isExiled ? s.survived : s.survived + 1 });
                            });
                        }
                    });
                }
                if (roomId) db.ref(`rooms/${roomId}`).remove(); 
                setRoomId(null); setCurrentView('lobby'); setShowEndModal(false);
            };

            // ФУНКЦИЯ ИСПОЛНЕНИЯ КОЗЫРЕЙ И ИХ УДАЛЕНИЯ
            const executeCard = (sourceDbIdx, cTxt, pName, targetDbIdx) => {
                const freshG = gameStateRef.current;
                const safePlayers = Array.isArray(freshG.players) ? freshG.players : Object.values(freshG.players);
                
                const sourcePlayer = safePlayers.find(x => x.id === sourceDbIdx + 1);
                const targetPlayer = safePlayers.find(x => x.id === targetDbIdx + 1);
                if (!sourcePlayer || !targetPlayer) return;

                const text = cTxt.toLowerCase(); 
                playSfx(sfx.stop);
                
                let bMsg = `⚡ Объект ${pName} применяет козырь:\n"${cTxt}"\n\n`;
                let updates = {};

                if (text.includes('убей') || text.includes('смерть') || text.includes('эвтаназия') || text.includes('кара')) { updates[`players/${targetDbIdx}/isExiled`] = true; bMsg += `💀 Объект №${targetPlayer.id} (${targetPlayer.name}) ИЗГНАН/УБИТ!`; }
                else if (text.includes('вылечи') || text.includes('здоровье ->')) { updates[`players/${targetDbIdx}/health`] = "Идеальное здоровье"; bMsg += `💉 Объект №${targetPlayer.id} полностью излечен!`; }
                else if (text.includes('радиация') || text.includes('лучевая')) { updates[`players/${targetDbIdx}/health`] = "Лучевая болезнь (Критическая)"; bMsg += `☢️ Объект №${targetPlayer.id} получил дозу радиации!`; }
                else if (text.includes('огнестрел') || text.includes('травм')) { updates[`players/${targetDbIdx}/health`] = "Тяжелая травма (Кровотечение)"; bMsg += `🩸 Объекту №${targetPlayer.id} нанесена травма!`; }
                else if (text.includes('инвалид') || text.includes('хромы')) { updates[`players/${targetDbIdx}/health`] = "Инвалидность (Без ноги)"; bMsg += `🦽 Объект №${targetPlayer.id} покалечен!`; }
                else if (text.includes('инфекция') || text.includes('зарази')) { updates[`players/${targetDbIdx}/health`] = sourcePlayer.health; bMsg += `🦠 Болезнь передана объекту №${targetPlayer.id}!`; }
                else if (text.includes('плодовит') || text.includes('дева мария')) { updates[`players/${targetDbIdx}/fert`] = "ПЛОДОВИТ (ИДЕАЛЬНО)"; bMsg += `🧬 ДНК объекта №${targetPlayer.id} улучшено!`; }
                else if (text.includes('бесплод') || text.includes('генетический сбой')) { updates[`players/${targetDbIdx}/fert`] = "БЕСПЛОДЕН"; bMsg += `🥀 Объект №${targetPlayer.id} теперь бесплоден.`; }
                else if (text.includes('забери') || text.includes('укради') || text.includes('ограбление') || text.includes('мародер')) { const stolenBag = targetPlayer.bag; updates[`players/${targetDbIdx}/bag`] = "Пустой рюкзак (Ограблен)"; if (sourceDbIdx !== targetDbIdx) updates[`players/${sourceDbIdx}/bag`] = stolenBag; bMsg += `🎒 Рюкзак объекта №${targetPlayer.id} облутан!`; }
                else if (text.includes('обмен') || text.includes('скам') || text.includes('бартер')) { const myBag = sourcePlayer.bag; updates[`players/${sourceDbIdx}/bag`] = targetPlayer.bag; updates[`players/${targetDbIdx}/bag`] = myBag; bMsg += `🔄 Игроки махнулись рюкзаками!`; }
                else if (text.includes('трупный яд') || text.includes('испорти')) { updates[`players/${targetDbIdx}/bag`] = "Сгнивший мусор (Испорчено)"; bMsg += `🤢 Инвентарь объекта №${targetPlayer.id} испорчен!`; }
                else if (text.includes('обнуление')) { safePlayers.forEach((p, i) => updates[`players/${i}/bag`] = "Пустой рюкзак"); bMsg += `💥 ГЛОБАЛЬНЫЙ ВАЙП ИНВЕНТАРЯ У ВСЕХ!`; }
                else if (text.includes('ампутация')) { updates[`players/${targetDbIdx}/health`] = "Идеальное здоровье"; updates[`players/${targetDbIdx}/bag`] = "Пустой рюкзак"; bMsg += `✂️ Объект №${targetPlayer.id} вылечен ценой потери инвентаря!`; }
                else if (text.includes('лоботомия') || text.includes('профнепригодность')) { updates[`players/${targetDbIdx}/prof`] = "Безработный Овощ"; bMsg += `🧠 Объект №${targetPlayer.id} потерял профессию!`; }
                else if (text.includes('скопируй') || text.includes('плагиат')) { updates[`players/${sourceDbIdx}/prof`] = targetPlayer.prof; bMsg += `🎭 Профессия скопирована!`; }
                else if (text.includes('психушка')) { updates[`players/${targetDbIdx}/phob`] = targetPlayer.hobby; updates[`players/${targetDbIdx}/hobby`] = "Отсутствует"; bMsg += `🤡 Хобби объекта №${targetPlayer.id} стало его фобией!`; }
                else if (text.includes('реинкарнация')) { updates[`players/${targetDbIdx}/prof`] = roll('prof'); updates[`players/${targetDbIdx}/health`] = roll('health'); updates[`players/${targetDbIdx}/hobby`] = roll('hobby'); bMsg += `✨ Полная реинкарнация статов объекта №${targetPlayer.id}!`; }
                else if (text.includes('вскрой') || text.includes('доносчик') || text.includes('разоблачение') || text.includes('грязное белье') || text.includes('сыщик')) { updates[`players/${targetDbIdx}/revealed/f1`] = true; updates[`players/${targetDbIdx}/revealed/f2`] = true; updates[`players/${targetDbIdx}/revealed/hobby`] = true; bMsg += `📢 Принудительное вскрытие фактов и хобби объекта №${targetPlayer.id}!`; }
                else if (text.includes('апокалипсис')) { safePlayers.forEach((p, i) => updates[`players/${i}/revealed`] = {bio:true, prof:true, health:true, bag:true, hobby:true, phob:true, fert:true, f1:true, f2:true}); bMsg += `🚨 АПОКАЛИПСИС! ВСЕ КАРТЫ У ВСЕХ ВСКРЫТЫ! 🚨`; }
                else { bMsg += `👉 На объекте №${targetPlayer.id} применен эффект козыря. Соблюдайте правила карты!`; } 
                
                // Удаляем карту из руки
                const currentActions = sourcePlayer.actions || [];
                const filteredActions = currentActions.filter(a => a !== cTxt);
                updates[`players/${sourceDbIdx}/actions`] = filteredActions.length > 0 ? filteredActions : ["🪫 ИСПОЛЬЗОВАНО"];

                db.ref(`rooms/${roomId}`).update(updates);
                botSay(bMsg);
            };

            const triggerCard = (sourceDbIdx, cTxt, pName, targetDbIdx = null) => {
                if (cTxt.includes('ИСПОЛЬЗОВАНО')) return;
                if (targetDbIdx === null && cTxt.toLowerCase().match(/сосед|игрок|кого|кому|забери|укради|убей|вскрой|цель|двоих|обмен|мародер|отдай|нанеси|свяжи|заставь|ослепление|психушка|инфекция/)) { 
                    setActiveActionModal({sourceDbIdx, cTxt, pName}); 
                } else { 
                    executeCard(sourceDbIdx, cTxt, pName, targetDbIdx !== null ? targetDbIdx : sourceDbIdx); 
                }
            };

            // 1. УНИВЕРСАЛЬНЫЙ ТАЙМЕР И ИГРОВОЙ ЦИКЛ
            useEffect(() => {
                if (!isAiRunner || !gameState?.active) return;
                const timer = setInterval(() => { 
                    const g = gameStateRef.current;
                    if (!g || !g.active) return; 

                    let updates = { time: (g.time || 0) + 1 };
                    if (g.turnTime > 0) updates.turnTime = g.turnTime - 1;
                    if (g.discussionTime > 0) updates.discussionTime = g.discussionTime - 1;
                    if (g.votingTime > 0) updates.votingTime = g.votingTime - 1;
                    if (g.eventTime > 0) updates.eventTime = g.eventTime - 1;
                    
                    db.ref(`rooms/${roomId}`).update(updates);
                }, 1000);
                return () => clearInterval(timer);
            }, [isAiRunner, gameState?.active, roomId]);

            // 2. ЛОГИКА ФАЗ И БОТОВ (ОТДЕЛЬНО ОТ ТАЙМЕРА ДЛЯ СТАБИЛЬНОСТИ)
            useEffect(() => {
                if (!isAiRunner || !gameState?.active) return;
                const g = gameState;
                const safePlayers = Array.isArray(g.players) ? g.players : Object.values(g.players);

                // --- ФАЗА 1: ВЫСТУПЛЕНИЯ ---
                if (g.phase === 'speaking') {
                    const currentP = safePlayers.find(p => p.id === g.speakerId);
                    
                    if (currentP && !currentP.uid && g.turnTime === -1) {
                        db.ref(`rooms/${roomId}/turnTime`).set(-2); 
                        setTimeout(() => {
                            try {
                                const freshG = gameStateRef.current;
                                const fPlayers = Array.isArray(freshG.players) ? freshG.players : Object.values(freshG.players);
                                const botP = fPlayers.find(p => p.id === freshG.speakerId);
                                
                                let updates = { turnTime: 5 };
                                
                                if (botP) {
                                    const botDbIdx = botP.id - 1;
                                    const hiddenStats = ['bio', 'prof', 'health', 'bag', 'hobby', 'phob', 'fert', 'f1', 'f2'].filter(f => f === 'bio' ? (!botP.revealed?.sex || !botP.revealed?.age) : !botP.revealed?.[f]);
                                    
                                    if (hiddenStats.length > 0) {
                                        const stat = hiddenStats[Math.floor(Math.random() * hiddenStats.length)];
                                        if(stat === 'bio') { 
                                            updates[`players/${botDbIdx}/revealed/sex`] = true;
                                            updates[`players/${botDbIdx}/revealed/age`] = true;
                                        } else { 
                                            updates[`players/${botDbIdx}/revealed/${stat}`] = true;
                                        }
                                        const valText = stat === 'bio' ? `${botP.sex}, ${botP.age} лет` : botP[stat];
                                        botSay(`💅 Бот ${botP.name} вскрывает: ${LABELS[stat] || stat} — [${valText}]`);
                                    } else {
                                        botSay(`💅 Бот ${botP.name} уже всё вскрыл, скрывать нечего. Он просто скипает ход.`);
                                        updates.turnTime = 0; 
                                    }
                                    db.ref(`rooms/${roomId}`).update(updates);
                                } else {
                                    db.ref(`rooms/${roomId}/turnTime`).set(0);
                                }
                            } catch (e) {
                                console.error(e);
                                db.ref(`rooms/${roomId}/turnTime`).set(0);
                            }
                        }, 2000);
                        return;
                    }

                    if (g.turnTime === 0 && g.speakerId !== null) {
                        db.ref(`rooms/${roomId}/turnTime`).set(-2);
                        setTimeout(() => {
                            try {
                                const freshG = gameStateRef.current;
                                const fPlayers = Array.isArray(freshG.players) ? freshG.players : Object.values(freshG.players);
                                const nextP = fPlayers.find(p => p.id > freshG.speakerId && !p.isExiled);
                                
                                if (nextP) {
                                    db.ref(`rooms/${roomId}`).update({ speakerId: nextP.id, turnTime: -1 });
                                    botSay(`💈 Очередь объекта №${nextP.id} (${nextP.name}). Вскрывай карту!`);
                                } else {
                                    db.ref(`rooms/${roomId}`).update({ speakerId: null, phase: 'discussion', discussionTime: 120, skipDiscVotes: null });
                                    botSay(`🗣 Раунд вскрытия характеристик завершен! Начинается общее обсуждение.\nУ вас 2 минуты. Если все готовы — жмите "Пропустить обсуждение"!`);
                                }
                            } catch(e) {
                                db.ref(`rooms/${roomId}`).update({ speakerId: null, phase: 'discussion', discussionTime: 120, skipDiscVotes: null });
                            }
                        }, 1000);
                        return;
                    }
                }

                // --- ФАЗА 2: ИВЕНТ ---
                if (g.phase === 'event') {
                    const skipEventVotesArr = g.skipEventVotes ? Object.values(g.skipEventVotes) : [];
                    const aliveRealCount = safePlayers.filter(p => !p.isExiled && p.uid).length;
                    const neededToSkip = Math.max(1, Math.ceil(aliveRealCount / 2));

                    if (skipEventVotesArr.length >= neededToSkip && aliveRealCount > 0) {
                        const nextSpk = g.speakerId || safePlayers.find(p=>!p.isExiled)?.id || 1;
                        db.ref(`rooms/${roomId}`).update({ phase: 'speaking', eventTime: -1, currentEvent: null, turnTime: -1, skipEventVotes: null, speakerId: nextSpk });
                        botSay(`⏭ Большинство проголосовало за скип! Ивент отменён (пронесло).\n💈 Продолжаем игру! Очередь объекта №${nextSpk}.`);
                        return;
                    }

                    if (g.eventTime === 60 && !window.evWarn60s) {
                        window.evWarn60s = true; botSay(`⏳ Осталась 1 минута на решение! Пишите "решение текст" в чат или скипните кнопкой!`);
                    }
                    if (g.eventTime === 0) {
                        window.evWarn60s = false;
                        const alive = safePlayers.filter(p => !p.isExiled);
                        if(alive.length > 0) {
                            const victim = alive[Math.floor(Math.random() * alive.length)];
                            db.ref(`rooms/${roomId}/players/${victim.id - 1}/health`).set("Стресс и паранойя");
                            botSay(`❌ Время вышло! Вы ничего не придумали, просто кринж.\nОбъект №${victim.id} получает травму на нервной почве.`);
                        }
                        
                        const nextSpk = g.speakerId || alive[0]?.id || 1;
                        db.ref(`rooms/${roomId}`).update({ phase: 'speaking', eventTime: -1, currentEvent: null, turnTime: -1, skipEventVotes: null, speakerId: nextSpk });
                        botSay(`💈 Продолжаем игру! Очередь объекта №${nextSpk}.`);
                        return;
                    }
                }

                // --- ФАЗА 3: ОБСУЖДЕНИЕ ---
                if (g.phase === 'discussion') {
                    const skipVotesArr = g.skipDiscVotes ? Object.values(g.skipDiscVotes) : [];
                    const aliveRealCount = safePlayers.filter(p => !p.isExiled && p.uid).length;
                    const neededToSkip = Math.max(1, Math.ceil(aliveRealCount / 2));

                    if (g.discussionTime === 30 && !window.discWarn30s) { window.discWarn30s = true; botSay(`⏳ До конца обсуждения 30 секунд! Заканчиваем срач!`); }
                    
                    if (g.discussionTime === 0 || (aliveRealCount > 0 && skipVotesArr.length >= neededToSkip)) {
                        window.discWarn30s = false;
                        db.ref(`rooms/${roomId}`).update({ phase: 'voting', votingTime: 30, discussionTime: -1, skipDiscVotes: null });
                        botSay(`🔴 Обсуждение завершено! Начинается ГОЛОСОВАНИЕ.\nУ вас 30 секунд. Жмите красную кнопку на экране!`);
                        return;
                    }
                }

                // --- ФАЗА 4: ГОЛОСОВАНИЕ И ИТОГИ ---
                if (g.phase === 'voting') {
                    if (g.votingTime === 15) {
                        let updates = {};
                        let changed = false;
                        const currentVotesMap = {};
                        safePlayers.forEach((p, i) => currentVotesMap[i] = getVotes(p));
                        
                        safePlayers.forEach(bot => {
                            if (!bot.uid && !bot.isExiled) {
                                let hasVoted = Object.values(currentVotesMap).some(votes => votes.includes(`bot_${bot.id}`));
                                if (!hasVoted) {
                                    let validTargets = safePlayers.filter(p => !p.isExiled && p.id !== bot.id);
                                    if (validTargets.length > 0) {
                                        let target = validTargets[Math.floor(Math.random() * validTargets.length)];
                                        let tIdx = target.id - 1;
                                        if(!currentVotesMap[tIdx]) currentVotesMap[tIdx] = [];
                                        currentVotesMap[tIdx].push(`bot_${bot.id}`);
                                        updates[`players/${tIdx}/votedBy`] = currentVotesMap[tIdx];
                                        changed = true;
                                    }
                                }
                            }
                        });
                        if (changed) db.ref(`rooms/${roomId}`).update(updates);
                    }

                    if (g.votingTime === 10 && !window.voteWarn10s) { window.voteWarn10s = true; botSay(`⏳ До конца голосования 10 секунд! Выбирайте цель!`); }

                    const totalVotes = safePlayers.reduce((sum, p) => sum + getVotes(p).length, 0);
                    const aliveTotalCount = safePlayers.filter(p => !p.isExiled).length;
                    
                    if (g.votingTime === 0 || (aliveTotalCount > 0 && totalVotes >= aliveTotalCount)) {
                        window.voteWarn10s = false;
                        
                        const currentG = gameStateRef.current;
                        const safeGPlayers = Array.isArray(currentG.players) ? currentG.players : Object.values(currentG.players);
                        let maxV = 0; let targetKick = null; let tie = false;
                        
                        safeGPlayers.forEach(p => {
                            if (p.isExiled) return;
                            const vCount = getVotes(p).length;
                            if (vCount > maxV) { maxV = vCount; targetKick = p; tie = false; }
                            else if (vCount === maxV && maxV > 0) tie = true;
                        });

                        let finalUpdates = { phase: 'results', votingTime: -2 };
                        let kickedId = null;
                        if (targetKick && !tie && maxV > 0) {
                            const kickIdx = targetKick.id - 1;
                            finalUpdates[`players/${kickIdx}/isExiled`] = true;
                            kickedId = targetKick.id;
                        }

                        db.ref(`rooms/${roomId}`).update(finalUpdates).then(() => {
                            if (maxV === 0 || tie) {
                                botSay(maxV === 0 ? `🌜 Голосование пропущено. В этом раунде никого не выгоняем.` : `⚖️ Ничья по голосам! Никто не уходит.`);
                            } else {
                                botSay(`🚪 БУНКЕР СДЕЛАЛ ВЫБОР! Изгнан №${targetKick.id} (${targetKick.name})! У него было ${maxV} голосов.`);
                            }

                            setTimeout(() => {
                                const freshG = gameStateRef.current;
                                const freshSafePlayers = Array.isArray(freshG.players) ? freshG.players : Object.values(freshG.players);
                                
                                const strictlyAlive = freshSafePlayers.filter(p => !p.isExiled && p.id !== kickedId);
                                const targetA = freshG.targetAlive;
                                
                                let clearVotesUpdates = {};
                                freshSafePlayers.forEach((p, i) => { clearVotesUpdates[`players/${i}/votedBy`] = null; });
                                
                                if (strictlyAlive.length <= targetA) {
                                    let tot = 0;
                                    strictlyAlive.forEach(p => {
                                        let sc = 50;
                                        if (p.revealed?.health || !p.uid) sc += p.health.includes("Идеал")||p.health.includes("Железный") ? 30 : p.health.includes("астма")||p.health.includes("диабет") ? -30 : 0;
                                        if (p.revealed?.fert || !p.uid) sc += p.fert.includes("ПЛОДОВИТ") ? 20 : p.fert.includes("БЕСПЛОДЕН") ? -40 : 0;
                                        tot += Math.max(0, Math.min(100, sc));
                                    });
                                    const avgChance = strictlyAlive.length ? Math.round(tot / strictlyAlive.length) : 0;
                                    const isWin = avgChance >= 49;
                                    
                                    botSay(`⚠️ НАЧИНАЕТСЯ ФИНАЛЬНОЕ ИСПЫТАНИЕ ⚠️\n\n🏆 СОСТАВ БУНКЕРА (${strictlyAlive.length}/${targetA})\n📊 Шанс выживания: ${avgChance}%.\n\n${isWin ? "🎉 ПОБЕДА! Бункер успешно заселен." : "💀 ПОРАЖЕНИЕ. С таким генофондом вы обречены."}`);
                                    
                                    freshSafePlayers.forEach(p => {
                                        if (p.uid) {
                                            db.ref(`users/${p.uid}/stats`).once('value').then(s => {
                                                const stats = s.val() || { games: 0, survived: 0 };
                                                const isSurvived = !p.isExiled && p.id !== kickedId;
                                                db.ref(`users/${p.uid}/stats`).set({ games: stats.games + 1, survived: (isSurvived && isWin) ? stats.survived + 1 : stats.survived });
                                            });
                                        }
                                    });
                                    db.ref(`rooms/${roomId}`).update({ ...clearVotesUpdates, active: false, phase: 'ended' });
                                } else {
                                    const nextRound = (freshG.round || 1) + 1;
                                    let evUpdates = { ...clearVotesUpdates, round: nextRound, speakerId: strictlyAlive[0].id, turnTime: -1 };
                                    
                                    if (nextRound === 2 && !freshG.eventsDone?.survivor) { 
                                        const ev = MY_BUNKER_EVENTS.SURVIVOR[Math.floor(Math.random() * MY_BUNKER_EVENTS.SURVIVOR.length)];
                                        evUpdates.phase = 'event'; evUpdates.currentEvent = ev; evUpdates.eventTime = 180; 
                                        evUpdates['eventsDone/survivor'] = true;
                                        evUpdates.skipEventVotes = null;
                                        botSay(`✨ ОПА! У нас тут проблемка подъехала!\n${ev.t}\n${ev.d}\n\n💬 У вас 3 минуты! Пишите в чат "решение текст".`);
                                    } else {
                                        evUpdates.phase = 'speaking';
                                        botSay(`💈 Раунд ${nextRound} начинается!\nОчередь объекта №${strictlyAlive[0].id}.`);
                                    }
                                    db.ref(`rooms/${roomId}`).update(evUpdates);
                                }
                            }, 5000);
                        });
                        return;
                    }
                }
            }, [gameState?.turnTime, gameState?.discussionTime, gameState?.votingTime, gameState?.eventTime, gameState?.phase, isAiRunner, roomId]);

            // 3. ЧАТ-КОМАНДЫ И РЕШЕНИЕ ИВЕНТОВ
            useEffect(() => {
                if (!isAiRunner || !roomId) return;
                
                const safeCurrentPlayers = gameStateRef.current?.players ? (Array.isArray(gameStateRef.current.players) ? gameStateRef.current.players : Object.values(gameStateRef.current.players)) : [];
                const currentSeated = safeCurrentPlayers.filter(p => p.uid);

                if (!gameStateRef.current?.active && gameStateRef.current?.phase === 'waiting' && currentSeated.length === parseInt(gameStateRef.current.pCount) && parseInt(gameStateRef.current.pCount) > 0) {
                    db.ref(`rooms/${roomId}`).update({ active: true, phase: 'speaking', speakerId: currentSeated[0].id, turnTime: -1 });
                    botSay(`🚀 Лобби заполнено! Авто-старт. Микрофон у №${currentSeated[0].id}.`);
                }

                const chatRef = db.ref(`rooms/${roomId}/chat`).limitToLast(1);
                const listener = chatRef.on('child_added', snap => {
                    const msg = snap.val();
                    if (!msg || msg.uid === 'ai_bot' || msg.time < Date.now() - 3000) return;
                    const text = msg.text.toLowerCase();

                    if (text.includes('решение') && gameStateRef.current?.phase === 'event') {
                        let solution = msg.text.substring(text.indexOf('решение') + 7).replace(/^[-:\s]+/, '').trim();
                        if (!solution) solution = "Какая-то странная идея...";
                        
                        botSay(`💡 Игрок ${msg.name} предлагает решение:\n"${solution}"\n\nАнализирую... 💅`);
                        
                        setTimeout(() => {
                            const success = Math.random() > 0.4;
                            if(success) { 
                                botSay(`✅ Вау, а это сработало! Мы спасены.`); 
                            } else { 
                                const latestSafePlayers = Array.isArray(gameStateRef.current.players) ? gameStateRef.current.players : Object.values(gameStateRef.current.players);
                                const alive = latestSafePlayers.filter(p => !p.isExiled);
                                if(alive.length > 0) {
                                    const victim = alive[Math.floor(Math.random() * alive.length)];
                                    db.ref(`rooms/${roomId}/players/${victim.id - 1}/health`).set("Сильная Паранойя");
                                    botSay(`❌ Полный бред. Ничего не вышло.\nОбъект №${victim.id} получает травму.`);
                                }
                            }
                            const latestSafePlayers2 = Array.isArray(gameStateRef.current.players) ? gameStateRef.current.players : Object.values(gameStateRef.current.players);
                            const nextSpk = gameStateRef.current.speakerId || latestSafePlayers2.find(p => !p.isExiled)?.id || 1;
                            db.ref(`rooms/${roomId}`).update({ phase: 'speaking', eventTime: -1, currentEvent: null, turnTime: -1, skipEventVotes: null, speakerId: nextSpk }).then(()=>{
                                botSay(`💈 Очередь объекта №${nextSpk}.`);
                            });
                        }, 4000);
                    }

                    if (text === '!старт' && ['owner', 'admin', 'host', 'tester'].includes(msg.role) && !gameStateRef.current?.active) {
                        let pList = "";
                        const latestSafePlayers = Array.isArray(gameStateRef.current.players) ? gameStateRef.current.players : Object.values(gameStateRef.current.players);
                        latestSafePlayers.forEach(p => { pList += `№${p.id}. ${p.name || "NPC Бот"} (Пол — ${p.sex})\n`; });
                        botSay(`🚨 Катастрофа: ${gameStateRef.current.bunker?.d || "Неизвестно"}!\n🎉 Выиграть могут: ${gameStateRef.current.targetAlive} игрока!\n\n📇 Игроки:\n${pList}`);
                        
                        setTimeout(() => {
                            const firstA = latestSafePlayers.find(p => !p.isExiled);
                            if (firstA) {
                                db.ref(`rooms/${roomId}`).update({ active: true, phase: 'speaking', speakerId: firstA.id, turnTime: -1 });
                                botSay(`💈 Время раскрытия характеристик!\nОчередь объекта №${firstA.id}.`);
                            }
                        }, 4000);
                    }
                    
                    const latestSafePlayersForSkip = Array.isArray(gameStateRef.current.players) ? gameStateRef.current.players : Object.values(gameStateRef.current.players);
                    if (['пас', 'я все'].includes(text) && msg.uid === latestSafePlayersForSkip.find(p => p.id === gameStateRef.current.speakerId)?.uid) {
                        db.ref(`rooms/${roomId}/turnTime`).set(0); botSay(`🎤 Речь завершена досрочно.`);
                    }
                    if (['скип', 'пропуск'].includes(text) && ['owner', 'admin', 'tester'].includes(msg.role)) {
                        if (gameStateRef.current?.phase === 'discussion') { db.ref(`rooms/${roomId}/discussionTime`).set(0); botSay(`⏭ Админ скипнул обсуждение.`); }
                        if (gameStateRef.current?.phase === 'event') { 
                            const nextSpk = gameStateRef.current.speakerId || latestSafePlayersForSkip.find(p=>!p.isExiled)?.id || 1;
                            db.ref(`rooms/${roomId}`).update({ phase: 'speaking', eventTime: -1, currentEvent: null, turnTime: -1, skipEventVotes: null, speakerId: nextSpk }); 
                            botSay(`⏭ Админ скипнул ивент без последствий.\n💈 Очередь объекта №${nextSpk}.`); 
                        }
                    }
                });
                return () => chatRef.off('child_added', listener);
            }, [isAiRunner, roomId]);
            
            const update = (path, val) => db.ref(`rooms/${roomId}/${path}`).set(val);
            
            const sendChat = () => {
                if (!msgInput.trim()) return;
                if (userMute && userMute.until > Date.now()) {
                    setSysAlert({ t: 'МУТ', d: `Вы в муте до ${new Date(userMute.until).toLocaleTimeString()}.\nПричина: ${userMute.reason}` });
                    return;
                }
                if (roomId) db.ref(`rooms/${roomId}/chat`).push({ uid: user?.uid, name: userName, role: role, text: msgInput, time: Date.now() });
                setMsgInput("");
            };

            const isLockedInOtherRoom = () => {
                for (const room of roomsList) {
                    if (room.id !== roomId) {
                        const pls = Array.isArray(room.players) ? room.players : (room.players ? Object.values(room.players) : []);
                        if (pls.some(p => p.uid === user?.uid && !p.isExiled)) return room.id;
                    }
                }
                return null;
            };

            const createRoom = () => {
                const stuckRoom = isLockedInOtherRoom();
                if (stuckRoom) {
                    setSysAlert({t: 'БЛОКИРОВКА', d: `Сначала закончи игру в комнате #${stuckRoom.slice(-4)}!`});
                    setShowCreateModal(false);
                    return;
                }

                const rId = db.ref('rooms').push().key;
                const parsedCount = parseInt(newRoomData.pCount);
                const targetA = Math.max(1, Math.floor(parsedCount / 2)); 
                const isAdm = ['owner', 'admin', 'curator', 'tester'].includes(role);
                
                const players = Array.from({ length: parsedCount }, (_, i) => {
                    const sex = roll('sex');
                    const bName = sex === "МУЖ" ? BOT_NAMES_M[Math.floor(Math.random()*BOT_NAMES_M.length)] : BOT_NAMES_F[Math.floor(Math.random()*BOT_NAMES_F.length)];
                    const bSurname = SURNAMES[Math.floor(Math.random()*SURNAMES.length)] + (sex === "ЖЕН" ? "а" : "");
                    const fullName = `${bName} ${bSurname}`;
                    return { id: i + 1, uid: '', name: fullName, sex, age: roll('age'), prof: roll('prof'), profExp: roll('years'), health: roll('health'), bag: roll('bag'), hobby: roll('hobby'), hobbyExp: roll('years'), phob: roll('phob'), f1: roll('facts'), f2: roll('facts'), fert: roll('fert'), actions: [MY_ACTION_CARDS[Math.floor(Math.random()*MY_ACTION_CARDS.length)], MY_ACTION_CARDS[Math.floor(Math.random()*MY_ACTION_CARDS.length)]], revealed: {}, votedBy: null, isExiled: false, avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${fullName}` };
                });

                const d_idx = newRoomData.disasterIndex === -1 ? Math.floor(Math.random() * DISASTERS.length) : newRoomData.disasterIndex;
                const dist = DISASTERS[d_idx];

                db.ref(`rooms/${rId}`).set({ 
                    id: rId, hostName: userName, hostUid: user.uid, isAdminHost: isAdm, pCount: parsedCount, 
                    createdAt: Date.now(), players, time: 0, active: false, phase: 'waiting', round: 1, 
                    targetAlive: targetA, speakerId: null, globalStop: null, dice: 1, 
                    turnTime: 0, discussionTime: 0, votingTime: 0, eventTime: 0, 
                    eventsDone: { survivor: false, raid: false }, 
                    aiHost: newRoomData.hostMode === 'bot', 
                    createdBy: userName, creatorRole: role, 
                    bunker: { d: `${dist.t}: ${dist.d}`, b: dist.b, i: dist.i },
                    isPrivate: newRoomData.isPrivate, password: newRoomData.isPrivate ? newRoomData.password : "",
                    lobbyName: newRoomData.lobbyName.trim() || "СЕКРЕТНЫЙ БУНКЕР"
                });
                
                setShowCreateModal(false);
                setRoomId(rId);
                setCurrentView('game');
                setTimeout(() => db.ref(`rooms/${rId}/chat`).push({ uid: 'ai_bot', name: 'ИИ-ВЕДУЩАЯ 🤖', role: 'host', text: `✅ Лобби создано!\n🎯 Цель: дожить до ${targetA} выживших.`, time: Date.now() }), 1000);
            };

            const handleJoinClick = (r) => {
                const stuckRoom = isLockedInOtherRoom();
                if (stuckRoom && stuckRoom !== r.id) return setSysAlert({t: 'БЛОКИРОВКА', d: `Ты уже играешь в другой комнате! Сначала умри там или дождись финала.`});
                
                const pls = Array.isArray(r.players) ? r.players : (r.players ? Object.values(r.players) : []);
                const isAlreadyInRoom = pls.some(p => p.uid === user?.uid);

                if ((r.active || r.phase !== 'waiting') && !isAlreadyInRoom && !isAdmin) {
                    return setSysAlert({t: 'ВХОД ЗАКРЫТ', d: 'Эта игра уже началась! Дождитесь её окончания или найдите другое лобби.'});
                }
                
                if (r.isPrivate && r.hostUid !== user.uid && !isAdmin && !isAlreadyInRoom) {
                    setJoinPwdModal(r);
                } else {
                    joinRoom(r.id);
                }
            };

            const submitJoinPwd = () => {
                if (joinPwdInput === joinPwdModal.password) { 
                    joinRoom(joinPwdModal.id); 
                    setJoinPwdModal(null); 
                    setJoinPwdInput(""); 
                } else { 
                    setSysAlert({t:'ОШИБКА', d:'Неверный пароль! Попробуй ещё раз.'}); 
                    setJoinPwdInput("");
                }
            };

            const handleQuickJoin = () => {
                const stuckRoom = isLockedInOtherRoom();
                if (stuckRoom) return setSysAlert({t: 'БЛОКИРОВКА', d: `Сначала закончи игру в комнате #${stuckRoom.slice(-4)}!`});
                
                const available = roomsList.filter(r => {
                    const pls = Array.isArray(r.players) ? r.players : (r.players ? Object.values(r.players) : []);
                    return !r.isPrivate && !r.active && r.phase === 'waiting' && pls.filter(p=>p.uid).length < r.pCount;
                });
                if (available.length === 0) return setSysAlert({t:'ОШИБКА', d:'Нет доступных открытых лобби для быстрой игры! Создай своё.'});
                available.sort((a,b) => {
                    const plsA = Array.isArray(a.players) ? a.players : (a.players ? Object.values(a.players) : []);
                    const plsB = Array.isArray(b.players) ? b.players : (b.players ? Object.values(b.players) : []);
                    return plsB.filter(p=>p.uid).length - plsA.filter(p=>p.uid).length;
                });
                joinRoom(available[0].id);
            };

            const joinRoom = (rId) => { 
                setRoomId(rId); setCurrentView('game'); 
            };

            const takeSeat = (pDbIdx) => {
                if (isAdmin) return setSysAlert({t: 'ОШИБКА', d: `Отключите Админ-режим, чтобы сесть в слот!`});
                if (gameState?.active || gameState?.phase !== 'waiting') return setSysAlert({t: 'ОШИБКА', d: `Игра уже началась, нельзя занять свободное место!`});
                
                const stuckRoom = isLockedInOtherRoom();
                if (stuckRoom) return setSysAlert({t: 'БЛОКИРОВКА', d: `Ты застрял в другой комнате! Занять новый слот нельзя.`});

                db.ref(`users/${user.uid}`).once('value', snap => {
                    const d = snap.val() || {};
                    update(`players/${pDbIdx}/uid`, user.uid);
                    update(`players/${pDbIdx}/name`, d.name || d.Name || userName);
                    update(`players/${pDbIdx}/userId`, d.userId || userId || 0);
                    update(`players/${pDbIdx}/stats`, d.stats || userStats || {games:0, survived:0});
                    const ava = d.avatar || d.Avatar || userAvatar;
                    if (ava) update(`players/${pDbIdx}/avatar`, ava);
                    playSfx(sfx.join);
                });
            };

            const leaveSeat = (pDbIdx) => {
                const safePlayers = Array.isArray(gameState.players) ? gameState.players : Object.values(gameState.players);
                const targetPlayer = safePlayers.find(p => p.id === pDbIdx + 1);
                const fullName = targetPlayer?.name.includes("ОБЪЕКТ") ? "Бот " + Math.floor(Math.random()*100) : targetPlayer?.name || "Бот"; 
                update(`players/${pDbIdx}/uid`, "");
                update(`players/${pDbIdx}/avatar`, `https://api.dicebear.com/7.x/bottts/svg?seed=${fullName}`);
            }

            const executePunishment = () => {
                if (!punishReason.trim()) return setSysAlert({ t: 'ОШИБКА', d: 'Укажите причину!' });
                const { uid, name, type } = punishModal;
                db.ref(`users/${uid}`).once('value', snap => {
                    const u = snap.val(); if(!u) return;
                    if (type === 'mute') {
                        const until = Date.now() + muteDuration * 60000;
                        db.ref(`users/${uid}/mute`).set({ until, reason: punishReason });
                        logAction('MUTE', name, `${muteDuration} мин: ${punishReason}`);
                        setSysAlert({ t: 'УСПЕШНО', d: `Игрок ${name} замучен на ${muteDuration} мин.` });
                    } else if (type === 'adminWarn') {
                        const w = (u.adminWarns || 0) + 1;
                        if (w >= 3) { db.ref(`users/${uid}/role`).set('player'); db.ref(`users/${uid}/adminWarns`).set(0); logAction('СНЯТИЕ РОЛИ', name, `3 выговора: ${punishReason}`); } 
                        else { db.ref(`users/${uid}/adminWarns`).set(w); logAction('АДМИН-ВАРН', name, `${punishReason}`); }
                    } else if (type === 'warn') {
                        const w = (u.warns || 0) + 1;
                        if (w >= 3) { db.ref(`users/${uid}/isBanned`).set(true); db.ref(`users/${uid}/banUntil`).set(Date.now() + 3 * 24 * 60 * 60 * 1000); db.ref(`users/${uid}/warns`).set(0); logAction('БАН 3 ДНЯ', name, `3 варна: ${punishReason}`); } 
                        else { db.ref(`users/${uid}/warns`).set(w); logAction('ВАРН ИГРОКУ', name, `${punishReason}`); }
                    } else if (type === 'ban') {
                        const isB = !u.isBanned;
                        db.ref(`users/${uid}/isBanned`).set(isB); db.ref(`users/${uid}/banUntil`).set(null);
                        logAction(isB ? 'БАН НАВСЕГДА' : 'РАЗБАН', name, punishReason);
                        setSysAlert({ t: isB ? 'БАН НАВСЕГДА' : 'РАЗБАН', d: `Игрок ${name} ${isB ? 'ЗАБАНЕН' : 'РАЗБАНЕН'}.` });
                    }
                    if(roomId) db.ref(`rooms/${roomId}/chat`).push({ uid: 'system', name: 'СИСТЕМА', role: 'owner', text: `Игрок ${name} получил наказание. Причина: ${punishReason}`, time: Date.now() });
                    setPunishModal(null); setPunishReason("");
                });
            };

            const assignRole = () => {
                if (!targetUserId) return;
                db.ref('users').orderByChild('userId').equalTo(Number(targetUserId)).once('value', snap => {
                    if (snap.exists()) {
                        const foundUid = Object.keys(snap.val())[0];
                        db.ref(`users/${foundUid}/role`).set(targetRole);
                        logAction('ВЫДАЧА РОЛИ', `ID ${targetUserId}`, `Роль: ${targetRole}`);
                        setSysAlert({ t: 'УСПЕШНО', d: `Роль выдана!` });
                        setShowOwnerPanel(false);

                                                    { req: (viewProfile.uid === user?.uid ? userStats?.games : viewProfile.stats?.games) >= 25, icon: '💀', name: 'Дитя Пустоши', desc: 'Сыграть 25 игр' },
                                                    { req: (viewProfile.uid === user?.uid ? userStats?.survived : viewProfile.stats?.survived) >= 25, icon: '🧬', name: 'Сверхчеловек', desc: 'Выжить 25 раз' },
                                                    { req: (viewProfile.uid === user?.uid ? userStats?.games : viewProfile.stats?.games) >= 50, icon: '🤖', name: 'Киборг', desc: 'Сыграть 50 игр' },
                                                    { req: (viewProfile.uid === user?.uid ? userStats?.survived : viewProfile.stats?.survived) >= 50, icon: '👁️', name: 'Смотритель', desc: 'Выжить 50 раз' },
                                                    { req: (viewProfile.uid === user?.uid ? userStats?.games : viewProfile.stats?.games) >= 250, icon: '🌌', name: 'Бессмертный', desc: 'Сыграть 250 игр' },
                                                    { req: (viewProfile.uid === user?.uid ? userStats?.survived : viewProfile.stats?.survived) >= 250, icon: '🌟', name: 'Создатель Мира', desc: 'Выжить 250 раз' },
                                                ].map((ach, i) => (
                                                    <div key={i} className={`flex flex-col items-center p-3 rounded-2xl border transition-all duration-300 ${ach.req ? 'bg-white/30 border-white shadow-[0_0_15px_rgba(255,255,255,0.3)]' : 'bg-black/30 border-white/10 opacity-50 grayscale'}`}>
                                                        <div className="text-4xl mb-3 drop-shadow-lg">{ach.req ? ach.icon : '🔒'}</div>
                                                        <div className="text-[10px] font-black uppercase tracking-widest text-center mb-1 text-white">{ach.req ? ach.name : 'Секрет'}</div>
                                                        <div className="text-[8px] font-bold uppercase text-white/60 text-center">{ach.desc}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {viewProfile.uid === user?.uid && (
                                            <button onClick={() => { auth.signOut(); window.location.reload(); }} className="mt-10 text-white/50 hover:text-white text-[10px] font-black uppercase tracking-widest border-b border-white/30 pb-1 transition-colors">
                                                ПОКИНУТЬ БУНКЕР (ВЫХОД)
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* ПАНЕЛЬ ВЛАДЕЛЬЦА */}
                            {showOwnerPanel && (
                                <div className="glass-overlay z-[99998] p-4" onClick={() => setShowOwnerPanel(false)}>
                                    <div className="glass-box max-w-6xl w-full h-[85vh] flex flex-col p-0 overflow-hidden" onClick={e=>e.stopPropagation()}>
                                        <div className="p-8 border-b border-white/20 flex justify-between items-center bg-white/10">
                                            <h2 className="text-3xl font-black uppercase text-white tracking-widest drop-shadow-[0_0_10px_white]">Центр Управления</h2>
                                            <button onClick={() => setShowOwnerPanel(false)} className="text-white/50 hover:text-white font-black text-2xl">✕</button>
                                        </div>
                                        <div className="flex flex-grow overflow-hidden text-left">
                                            <div className="w-1/3 border-r border-white/10 flex flex-col p-4 bg-white/5">
                                                <h3 className="font-black uppercase text-white/70 mb-4 px-2 tracking-widest text-sm text-center">СИСТЕМНЫЕ ЛОГИ</h3>
                                                <div className="flex-grow overflow-y-auto space-y-2 pr-2">
                                                    {systemLogs.map((lg, i) => (
                                                        <div key={i} className="bg-black/40 p-3 rounded-xl border border-white/10 text-[10px] font-mono shadow-inner">
                                                            <div className="flex justify-between text-white/50 mb-1">
                                                                <span>{new Date(lg.time).toLocaleTimeString()} | {lg.admin}</span>
                                                                <span className="text-white font-bold">{lg.action}</span>
                                                            </div>
                                                            <div className="text-white/90">Цель: {lg.target}</div>
                                                            <div className="text-white/70">Причина: {lg.reason}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="w-2/3 flex flex-col p-6 overflow-y-auto gap-8">
                                                {role === 'owner' && (
                                                    <div className="bg-white/10 p-6 rounded-3xl border border-white/20 shadow-lg">
                                                        <h3 className="font-black uppercase text-white mb-4 tracking-widest text-lg drop-shadow-md">Выдача Ролей</h3>
                                                        <div className="flex gap-4">
                                                            <input type="number" value={targetUserId} onChange={e => setTargetUserId(e.target.value)} className="p-input !mb-0 text-base" placeholder="ID Игрока" />
                                                            <select value={targetRole} onChange={e => setTargetRole(e.target.value)} className="bg-white/10 border-2 border-white/30 rounded-xl px-4 text-sm text-white font-black outline-none backdrop-blur-md">
                                                                <option value="player" className="text-black">Игрок</option><option value="tester" className="text-black">Тестер</option><option value="curator" className="text-black">Куратор</option><option value="admin" className="text-black">Администратор</option>
                                                            </select>
                                                            <button onClick={assignRole} className="bg-white text-black px-8 rounded-xl font-black text-sm hover:scale-105 shadow-[0_0_15px_white] transition-transform">Выдать</button>
                                                        </div>
                                                    </div>
                                                )}
                                                <div>
                                                    <h3 className="font-black uppercase text-white mb-4 tracking-widest text-lg drop-shadow-md">Апелляции банов</h3>
                                                    <div className="space-y-3">
                                                        {appealsList.length === 0 ? <p className="opacity-50 text-sm italic font-bold">Пусто...</p> : appealsList.map(([id, ap]) => (
                                                            <div key={id} className="bg-white/10 border border-white/20 p-4 rounded-2xl flex justify-between items-center shadow-md">
                                                                <div>
                                                                    <div className="font-black text-white text-sm uppercase">{ap.name} <span className="opacity-50 text-xs ml-2 normal-case font-mono">{new Date(ap.time).toLocaleString()}</span></div>
                                                                    <div className="text-white/80 mt-1 text-sm font-medium">{ap.text}</div>
                                                                </div>
                                                                <button onClick={() => { db.ref(`users/${ap.uid}/isBanned`).set(false); db.ref(`appeals/${id}`).remove(); logAction('РАЗБАН', ap.name, 'Апелляция'); setSysAlert({t:'УСПЕХ',d:'Разбанен'}); }} className="bg-white text-black px-6 py-3 rounded-xl text-xs font-black hover:bg-gray-200 transition-colors shadow-lg">Разбанить</button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div>
                                                    <h3 className="font-black uppercase text-white mb-4 tracking-widest text-lg drop-shadow-md">Репорты (Связь)</h3>
                                                    <div className="space-y-3">
                                                        {bugReports.length === 0 ? <p className="opacity-50 text-sm italic font-bold">Пусто...</p> : bugReports.map(([id, rp]) => (
                                                            <div key={id} className="bg-white/10 border border-white/20 p-5 rounded-2xl shadow-md">
                                                                <div className="flex justify-between items-center mb-3 border-b border-white/10 pb-2">
                                                                    <div className="font-black text-white text-sm uppercase">{rp.name}</div>
                                                                    <button onClick={() => db.ref(`reports/${id}`).remove()} className="text-white/50 text-xs hover:text-white font-black uppercase transition-colors">Удалить</button>
                                                                </div>
                                                                <div className="text-white/90 text-sm font-medium">{rp.text}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ПАНЕЛЬ ШТАБА */}
                            {showStaffPanel && (
                                <div className="glass-overlay z-[99998]" onClick={() => setShowStaffPanel(false)}>
                                    <div className="glass-box max-w-3xl w-full max-h-[80vh] flex flex-col p-0 overflow-hidden" onClick={e=>e.stopPropagation()}>
                                        <div className="p-8 border-b border-white/20 flex justify-between items-center bg-white/10">
                                            <h2 className="text-4xl font-black uppercase text-white tracking-widest drop-shadow-[0_0_10px_white]">Штаб Кураторов</h2>
                                            <button onClick={() => setShowStaffPanel(false)} className="text-white/50 hover:text-white font-black text-2xl transition-colors">✕</button>
                                        </div>
                                        
                                        <div className="flex-grow overflow-y-auto pr-4 space-y-4 p-8 text-left">
                                            {staffList.length === 0 ? <p className="text-center text-white/40 uppercase font-black py-10">В штабе пока пусто...</p> : 
                                                staffList.map(st => (
                                                    <div key={st.uid} className="bg-white/10 border border-white/20 p-5 rounded-2xl flex items-center justify-between hover:bg-white/20 transition-colors shadow-md">
                                                        <div className="flex items-center gap-5 cursor-pointer" onClick={() => {setViewProfile(st); setShowStaffPanel(false);}} title="Посмотреть профиль">
                                                            <img src={st.avatar || `https://i.pravatar.cc/150?u=${st.uid}`} className="w-16 h-16 rounded-xl object-cover border-2 border-white/30 hover:border-white transition-colors shadow-lg" />
                                                            <div>
                                                                <div className="font-black text-2xl uppercase tracking-wider hover:text-white/80 transition-colors text-white drop-shadow-md">{st.name || "Аноним"}</div>
                                                                <div className="text-xs font-mono text-white/70 font-bold uppercase tracking-widest mt-1 bg-black/40 px-2 py-1 rounded-lg inline-block">РОЛЬ: {st.role} | ID: {st.userId} | ВАРНЫ: {st.adminWarns||0}/3</div>
                                                            </div>
                                                        </div>
                                                        {role === 'owner' && (
                                                        <div className="flex gap-2">
                                                            <button onClick={() => { setShowStaffPanel(false); setPunishModal({uid: st.uid, name: st.name, type: 'adminWarn'}); }} className="bg-white/10 text-white border border-white/30 px-5 py-3 rounded-xl font-black text-xs uppercase hover:bg-white hover:text-black transition-all shadow-md">ВЫГОВОР</button>
                                                        </div>
                                                        )}
                                                    </div>
                                                ))
                                            }
                                        </div>
                                    </div>
                                </div>
                            )}

                        </>
                    )}

                    {/* СИСТЕМНОЕ ОКНО ОШИБОК/АЛЕРТОВ (САМОЕ ВЕРХНЕЕ) */}
                    {sysAlert && (
                        <div className="glass-overlay z-[9999999]" onClick={() => setSysAlert(null)}>
                            <div className="glass-box max-w-sm w-full border-white/40 shadow-[0_0_50px_rgba(255,255,255,0.2)] alert-box" onClick={e => e.stopPropagation()}>
                                <h3 className="text-3xl font-black uppercase tracking-widest text-white mb-4 drop-shadow-md">{sysAlert.t}</h3>
                                <p className="text-white/90 font-bold text-lg mb-8 whitespace-pre-wrap">{sysAlert.d}</p>
                                <button onClick={() => setSysAlert(null)} className="w-full bg-white text-black py-4 rounded-xl font-black uppercase hover:bg-gray-200 transition-colors shadow-lg">Понятно</button>
                            </div>
                        </div>
                    )}
                    
                    {/* ОКНА НАКАЗАНИЙ */}
                    {punishModal && punishModal.type === 'mute' && (
                        <div className="glass-overlay z-[9999998]">
                            <div className="glass-box max-w-lg w-full">
                                <h3 className="text-3xl font-black uppercase text-white mb-2 drop-shadow-[0_0_10px_white]">Настройка Мута</h3>
                                <p className="text-white/60 text-sm mb-8 uppercase font-bold tracking-widest">Цель: {punishModal.name}</p>
                                
                                <select value={muteDuration} onChange={e => setMuteDuration(Number(e.target.value))} className="w-full bg-white/10 border border-white/30 rounded-xl p-4 text-white font-black mb-4 outline-none backdrop-blur-md cursor-pointer">
                                    <option value={15} className="text-black">15 Минут</option>
                                    <option value={60} className="text-black">1 Час</option>
                                    <option value={1440} className="text-black">24 Часа</option>
                                </select>
                                
                                <input autoFocus value={punishReason} onChange={e => setPunishReason(e.target.value)} placeholder="Причина мута (оск, спам)..." className="p-input text-lg py-4 mb-8" />
                                
                                <div className="flex gap-4">
                                    <button onClick={executePunishment} className="flex-grow bg-white text-black py-4 rounded-xl font-black uppercase hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.4)]">Выдать Мут</button>
                                    <button onClick={() => {setPunishModal(null); setPunishReason("");}} className="px-8 bg-white/10 text-white py-4 rounded-xl font-black uppercase hover:bg-white/20 transition-colors border border-white/30">Отмена</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {punishModal && punishModal.type !== 'mute' && (
                        <div className="glass-overlay z-[9999998]">
                            <div className="glass-box max-w-lg w-full border-red-500/50 shadow-[0_0_50px_rgba(255,0,0,0.2)]">
                                <h3 className="text-3xl font-black uppercase text-red-500 mb-2 drop-shadow-[0_0_10px_red]">Наказание</h3>
                                <p className="text-white/60 text-sm mb-8 uppercase font-bold tracking-widest">Цель: {punishModal.name}</p>
                                
                                <input autoFocus value={punishReason} onChange={e => setPunishReason(e.target.value)} placeholder="Причина (мат, оск, лив и тд)..." className="p-input text-lg py-4 mb-8 border-red-500/30 focus:border-red-500" />
                                
                                <div className="flex gap-4">
                                    <button onClick={executePunishment} className="flex-grow bg-red-600 text-white py-4 rounded-xl font-black uppercase hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,0,0,0.4)]">Выдать</button>
                                    <button onClick={() => {setPunishModal(null); setPunishReason("");}} className="px-8 bg-white/10 text-white py-4 rounded-xl font-black uppercase hover:bg-white/20 transition-colors border border-white/30">Отмена</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script></body></html>
